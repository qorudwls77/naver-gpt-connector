openapi: 3.1.0
info:
  title: 네이버-챗GPT 연동 API
  description: >
    챗GPT가 네이버 검색(카테고리별), 네이버 URL 콘텐츠 확인, 구글 트렌드(무료)를
    조회할 수 있도록 해주는 중간 API입니다.
  version: "1.0.0"
servers:
  - url: https://naver-gpt-connector.vercel.app
paths:
  /api/search:
    get:
      operationId: searchNaver
      summary: 네이버 카테고리 검색 (블로그, 뉴스, 쇼핑 등)
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
          description: 검색어
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [blog, news, book, encyc, cafearticle, kin, local, webkr, image, shop, doc, movie]
            default: blog
          description: 검색 카테고리
        - name: display
          in: query
          required: false
          schema:
            type: integer
            default: 10
          description: 결과 개수 (최대 100)
        - name: start
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: 검색 시작 위치
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [sim, date]
            default: sim
          description: 정렬 방식 (sim=정확도순, date=날짜순)
      responses:
        "200":
          description: 검색 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: string
                  type:
                    type: string
                  total:
                    type: integer
                  items:
                    type: array
                    items:
                      type: object

  /api/content:
    get:
      operationId: getNaverContent
      summary: 네이버 URL(블로그/뉴스/카페 등)의 본문 텍스트를 가져옵니다
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            format: uri
          description: 콘텐츠를 확인할 URL
      responses:
        "200":
          description: 페이지 본문
          content:
            application/json:
              schema:
                type: object
                properties:
                  requested_url:
                    type: string
                  fetched_url:
                    type: string
                  title:
                    type: string
                  content:
                    type: string
                  truncated:
                    type: boolean

  /api/trends:
    get:
      operationId: getGoogleTrends
      summary: 구글 트렌드 관심도 추이를 조회합니다 (무료 비공식 방식)
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
          description: 트렌드를 조회할 키워드
        - name: geo
          in: query
          required: false
          schema:
            type: string
            default: KR
          description: 국가 코드 (기본값 한국)
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            default: "today 3-m"
          description: '조회 기간 (예: "now 7-d", "today 1-m", "today 3-m", "today 12-m")'
      responses:
        "200":
          description: 트렌드 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  keyword:
                    type: string
                  geo:
                    type: string
                  timeframe:
                    type: string
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                        value:
                          type: number
